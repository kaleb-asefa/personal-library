<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>{% block title %}Personal Library{% endblock %}</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,650;9..144,800&family=Manrope:wght@400;600;700;800&display=swap" rel="stylesheet">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.css" rel="stylesheet">
    <link href="{{ url_for('static', path='/css/library.css') }}?v=account-chip" rel="stylesheet">
    {% block head_extra %}{% endblock %}
    <script src="https://unpkg.com/htmx.org@2.0.4" defer></script>
</head>
<body
    data-current-path="{{ request.url.path }}"
    hx-boost="true"
    hx-target="#page-content"
    hx-select="#page-content"
    hx-swap="outerHTML show:window:top"
    hx-push-url="true"
    hx-indicator="#route-loader"
>
    {% set active_path = request.url.path %}
    <div id="route-loader" class="route-loader htmx-indicator"></div>

    <nav class="app-nav">
        <a class="brand-mark" href="/">
            <i class="bi bi-bookshelf"></i>
            <span>Personal Library</span>
        </a>

        <div class="nav-actions">
            <a data-nav-link data-auth-only data-session-link="shelf" class="nav-link-pill" href="/" hidden>
                <i class="bi bi-bookshelf"></i>
                <span>My Shelf</span>
            </a>
            <a data-nav-link data-auth-only class="nav-link-pill {{ 'is-active' if active_path == '/books/new' else '' }}" href="/books/new" {% if active_path == '/books/new' %}aria-current="page"{% endif %} hidden>
                <i class="bi bi-plus-square"></i>
                <span>Add Book</span>
            </a>
            <a data-nav-link data-auth-only data-session-link="settings" class="account-chip" href="/" hidden>
                <img data-session-avatar class="account-avatar" src="{{ url_for('static', path='/profile/default.png') }}" alt="Profile image">
                <span class="account-chip-copy">
                    <span class="account-kicker">Signed in as</span>
                    <strong data-session-username>Account</strong>
                </span>
            </a>
            <a data-nav-link data-auth-only class="nav-link-pill" href="/logout" hidden>
                <i class="bi bi-box-arrow-right"></i>
                <span>Sign Out</span>
            </a>
            <a data-nav-link data-guest-only class="nav-link-pill {{ 'is-active' if active_path == '/login' else '' }}" href="/login" {% if active_path == '/login' %}aria-current="page"{% endif %}>
                <i class="bi bi-box-arrow-in-right"></i>
                <span>Sign In</span>
            </a>
            <a data-nav-link data-guest-only class="nav-link-pill nav-link-strong {{ 'is-active' if active_path == '/users/new' else '' }}" href="/users/new" {% if active_path == '/users/new' %}aria-current="page"{% endif %}>
                <i class="bi bi-person-plus"></i>
                <span>Create Account</span>
            </a>
        </div>
    </nav>

    <main id="page-content" class="page-shell">
        {% block content %}{% endblock %}
    </main>

    <script src="{{ url_for('static', path='/js/forms.js') }}"></script>
    {% block scripts %}{% endblock %}
</body>
</html>
