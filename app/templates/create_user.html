{% extends "base.html" %}

{% block title %}Create Account | Personal Library{% endblock %}

{% block content %}
    <section class="form-layout">
        <div class="form-intro">
            <p class="eyebrow">Your library starts here</p>
            <h1>Create account</h1>
            <p class="page-lede">Set up one private place for the books you want to read and the stories you finish.</p>
        </div>

        <form class="action-form" data-api-form="create-user" hx-boost="false">
            <div class="form-alert" data-form-message hidden></div>

            <label class="field-group">
                <span>Username</span>
                <input class="form-control" name="username" type="text" maxlength="255" autocomplete="username" required>
            </label>

            <label class="field-group">
                <span>Email</span>
                <input class="form-control" name="email" type="email" maxlength="255" autocomplete="email" required>
            </label>

            <label class="field-group">
                <span>Password</span>
                <input class="form-control" name="password" type="password" minlength="8" autocomplete="new-password" required>
            </label>

            <button class="btn btn-dark submit-button" type="submit">
                <i class="bi bi-person-plus"></i>
                Create Account
            </button>
            <p class="form-footnote">Already have an account? <a href="/login">Sign in</a></p>
        </form>
    </section>
{% endblock %}
