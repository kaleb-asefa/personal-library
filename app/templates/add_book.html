{% extends "base.html" %}

{% block title %}Add Book | Personal Library{% endblock %}

{% block content %}
    <section class="form-layout form-layout-wide" data-auth-required>
        <div class="form-intro">
            <p class="eyebrow">Books</p>
            <h1>Add book</h1>
            <p class="page-lede">Save a title to your reading queue. You can mark it finished and rate it later.</p>
        </div>

        <form class="action-form" data-api-form="add-book" hx-boost="false">
            <div class="form-alert" data-form-message hidden></div>

            <label class="field-group">
                <span>Title</span>
                <input class="form-control" name="title" type="text" maxlength="255" required>
            </label>

            <label class="field-group">
                <span>Author</span>
                <input class="form-control" name="author_name" type="text" maxlength="255" list="author-options" autocomplete="off" required>
                <datalist id="author-options">
                    {% for author in authors %}
                        <option value="{{ author.name }}"></option>
                    {% endfor %}
                </datalist>
            </label>

            <label class="field-group">
                <span>Published year</span>
                <input class="form-control" name="published_year" type="number" min="0" max="3000" required>
            </label>

            <fieldset class="field-group genre-picker">
                <legend>Genres</legend>
                <div class="checkbox-grid">
                    {% for genre in genres %}
                        <label>
                            <input type="checkbox" name="genre_names" value="{{ genre.name }}">
                            <span>{{ genre.name }}</span>
                        </label>
                    {% endfor %}
                </div>
            </fieldset>

            <button class="btn btn-dark submit-button" type="submit">
                <i class="bi bi-plus-lg"></i>
                Add Book
            </button>
        </form>
    </section>
{% endblock %}
